<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="High speed internet cabin">
  <defs>
    <linearGradient id="in-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B2545"/><stop offset="1" stop-color="#123C6E"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#in-bg)"/>
  <circle cx="130" cy="100" r="120" fill="#1668E3" fill-opacity=".22"/>
  <circle cx="700" cy="420" r="110" fill="#E8A33D" fill-opacity=".12"/>

  <g transform="translate(286,104)">
    <!-- monitor -->
    <rect x="0" y="0" width="228" height="150" rx="18" fill="#FFFFFF" fill-opacity=".08" stroke="#FFFFFF" stroke-width="8"/>
    <path d="M84 150h60l12 40H72z" fill="#FFFFFF" fill-opacity=".18"/>
    <rect x="56" y="190" width="116" height="14" rx="7" fill="#FFFFFF" fill-opacity=".28"/>
    <!-- wifi arcs -->
    <g fill="none" stroke="#25D366" stroke-width="10" stroke-linecap="round">
      <path d="M74 96a56 56 0 0 1 80 0"/>
      <path d="M92 74a82 82 0 0 1 44 0" opacity=".75"/>
      <path d="M56 118a82 82 0 0 1 116 0" opacity=".5"/>
    </g>
    <circle cx="114" cy="112" r="9" fill="#25D366"/>
  </g>
  <text x="400" y="452" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF">Internet Cabin</text>
</svg>
