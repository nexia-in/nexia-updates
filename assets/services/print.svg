      <stop offset="0" stop-color="#F3F7FE"/><stop offset="1" stop-color="#E1EAF8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#pr-bg)"/>
  <circle cx="670" cy="400" r="120" fill="#1668E3" fill-opacity=".07"/>

