<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family="sans-serif">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#bg-grad)"/>
  <rect x="10" y="10" width="620" height="340" fill="none" stroke="#3b82f6" stroke-width="2" rx="12" opacity="0.5"/>

  <!-- Header -->
  <text x="320" y="50" font-size="25" font-weight="bold" fill="#facc15" text-anchor="middle">SSC CHSL 2026 വിജ്ഞാപനം എത്തി! 🇮🇳✨</text>
  <text x="320" y="85" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">പ്ലസ് ടു കഴിഞ്ഞവർക്ക് കേന്ദ്ര സർക്കാർ ജോലി</text>

  <!-- Subtitle -->
  <text x="320" y="115" font-size="14" fill="#93c5fd" text-anchor="middle">സ്റ്റാഫ് സെലക്ഷൻ കമ്മീഷൻ (SSC) വഴി 2,536 ഒഴിവുകളിലേക്ക് അപേക്ഷ ക്ഷണിച്ചു.</text>
  <text x="320" y="135" font-size="13" fill="#cbd5e1" text-anchor="middle">(LDC, JSA, Data Entry Operator)</text>

  <!-- Details Grid -->
  <!-- Qualification Box -->
  <rect x="25" y="160" width="285" height="80" rx="8" fill="url(#card-grad)" stroke="#334155"/>
  <text x="40" y="185" font-size="13" fill="#94a3b8">📌 വിദ്യാഭ്യാസ യോഗ്യത:</text>
  <text x="40" y="215" font-size="17" font-weight="bold" fill="#ffffff">പ്ലസ് ടു (+2 / 12th Pass)</text>

  <!-- Age Box -->
  <rect x="330" y="160" width="285" height="80" rx="8" fill="url(#card-grad)" stroke="#334155"/>
  <text x="345" y="185" font-size="13" fill="#94a3b8">📌 പ്രായപരിധി:</text>
  <text x="345" y="210" font-size="18" font-weight="bold" fill="#ffffff">18 - 27 വയസ്സ്</text>
  <text x="345" y="228" font-size="11" fill="#cbd5e1">(സംവരണ വിഭാഗങ്ങൾക്ക് ഇളവുകൾ ബാധകം)</text>

  <!-- Salary Box -->
  <rect x="25" y="255" width="285" height="80" rx="8" fill="url(#card-grad)" stroke="#334155"/>
  <text x="40" y="280" font-size="13" fill="#94a3b8">📌 ശമ്പളം:</text>
  <text x="40" y="310" font-size="17" font-weight="bold" fill="#ffffff">₹30,000/- മുതൽ മുകളിലോട്ട്</text>

  <!-- Date Box -->
  <rect x="330" y="255" width="285" height="80" rx="8" fill="url(#card-grad)" stroke="#ef4444" stroke-width="1.5"/>
  <text x="345" y="280" font-size="13" fill="#94a3b8">📌 അവസാന തീയതി:</text>
  <text x="345" y="310" font-size="18" font-weight="bold" fill="#fca5a5">2026 ഒക്ടോബർ 07</text>
</svg>
